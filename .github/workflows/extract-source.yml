name: Extract GuideZenAI source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'Extract GuideZenAI source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -o GuideZenAI-Vercel-Source.zip
          rm GuideZenAI-Vercel-Source.zip
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract GuideZenAI source"
          git push
